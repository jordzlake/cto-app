# nginx: add this block INSIDE your existing `server { ... }` for the site
# (e.g. /etc/nginx/sites-available/default). Then: sudo nginx -t && sudo systemctl reload nginx
#
# Serves the CTO app at /cto -> Next.js (pm2) on 127.0.0.1:3010.
# No trailing slash on proxy_pass: the /cto prefix must be passed through unchanged.

location ^~ /cto {
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    client_max_body_size 2m;
}
