# Apache: copy to /etc/apache2/conf-available/cto-app.conf, then:
#   sudo a2enmod proxy proxy_http headers
#   sudo a2enconf cto-app
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Serves the CTO app at /cto -> Next.js (pm2) on 127.0.0.1:3010.
# The /cto prefix is passed through unchanged (the app is built with BASE_PATH=/cto).

ProxyPreserveHost On
ProxyRequests Off
<Location /cto>
    ProxyPass        http://127.0.0.1:3010/cto
    ProxyPassReverse http://127.0.0.1:3010/cto
</Location>
